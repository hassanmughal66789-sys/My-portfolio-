<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Bestie Huma</title>
<style>
body{
  background: linear-gradient(135deg, #ff9a9e, #fecfef, #a18cd1);
  min-height:100vh;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  text-align:center;
  overflow:hidden;
}
.card{
  background:white;
  padding:35px 25px;
  border-radius:25px;
  width:85%;
  max-width:350px;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
}
h1{color:#ff4b7d; margin:10px 0; font-size:32px;}
#name{color:#a18cd1; font-size:40px; animation: glow 1.5s infinite;}
@keyframes glow{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
p{color:#555; font-size:17px; line-height:1.5;}
button{
  background: linear-gradient(to right, #ff758c, #ff7eb3);
  border:none;
  color:white;
  padding:14px 30px;
  border-radius:50px;
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(255,117,140,0.4);
}
#msg{
  margin-top:20px;
  font-size:20px;
  color:#ff4b7d;
  font-weight:bold;
  min-height:50px;
  transition:0.3s;
}
.heart{
  position:absolute;
  animation: float 3s linear forwards;
  font-size:20px;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0)}
  100%{transform:translateY(-10vh) scale(1.5); opacity:0}
}
</style>
</head>
<body>

<div class="card">
  <div style="font-size:60px">👯‍♀️💖</div>
  <h1>My Bestie</h1>
  <h1 id="name">HUMA</h1>
  <p>You are not just my friend,<br>you are my sister, my secret keeper!</p>
  <button onclick="specialFeel()">Click For Special Feel ✨</button>
  <div id="msg">Huma, click karo 👇</div>
</div>

<script>
const messages = [
  "Huma, tum best ho yaar! 💖",
  "Tumhari smile sabse pyari hai 😍",
  "Bestie like you is rare! 👯‍♀️",
  "Tum ho to har din special hai ✨",
  "Huma, tum Queen ho! 👑",
  "Teri dosti = Meri strength 💪❤️",
  "Huma, you make my life beautiful 🌸",
  "Tumhari jaisi dost kismat se milti hai 🤞",
  "Hamesha aise hi hasti rehna Huma 😊",
  "My Bestie Forever - HUMA 💕"
];
let i=0;
function specialFeel(){
  document.getElementById('msg').innerHTML = messages[i];
  i = (i+1) % messages.length;
  
  // Dil barsana
  for(let k=0;k<6;k++){
    let h = document.createElement('div');
    h.className='heart';
    h.innerHTML=['❤️','💖','💕','🌸','✨'][Math.floor(Math.random()*5)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.animationDuration = (Math.random()*2+2)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
  
  // Phone vibrate if possible
  if(navigator.vibrate) navigator.vibrate(100);
}
</script>

</body>
  </html>
